# Local environment: PostgreSQL, Keycloak (IdP), LocalStack (SQS) and the
# wallet service split into components. Every component is the same image
# with different flags, and each one receives ONLY the credentials it uses:
#
#   component        replicas  DB role        AWS identity         inbound port
#   api              3         wallet_app     (none)               8081-8083
#   consumer         2         wallet_app     wallet-consumer      internal only
#   pending-worker   2         wallet_app     (none)               internal only
#   outbox-relay     2         wallet_relay   wallet-outbox-relay  internal only
#
# Internal-only components still serve /health/* and /metrics on :8080 inside
# the network (healthchecks, Prometheus) but publish no port on the host.
#
#   docker compose up --build            # everything
#   docker compose up -d postgres keycloak localstack   # only test dependencies

x-component: &component
  build: .
  image: jungle-wallet-service:local
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20
  stop_grace_period: 40s

# Everything disabled; each component turns on its own flag.
x-flags-off: &flags-off
  API_ENABLED: "false"
  SQS_CONSUMER_ENABLED: "false"
  PENDING_WORKER_ENABLED: "false"
  OUTBOX_ENABLED: "false"
  LOG_LEVEL: info

x-money-db: &money-db
  DATABASE_URL: postgres://wallet_app:wallet_app_local@postgres:5432/wallet?sslmode=disable
  DATABASE_MAX_CONNS: "20"

x-aws: &aws
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566

x-api-env: &api-env
  <<: [*flags-off, *money-db]
  API_ENABLED: "true"
  OIDC_ISSUER: http://localhost:8180/realms/jungle
  OIDC_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
  OIDC_AUDIENCE: wallet-api

x-consumer-env: &consumer-env
  <<: [*flags-off, *money-db, *aws]
  SQS_CONSUMER_ENABLED: "true"
  AWS_ACCESS_KEY_ID: wallet-consumer
  AWS_SECRET_ACCESS_KEY: wallet-consumer-local
  SQS_INGRESS_QUEUE: wager-transactions.fifo
  SQS_INGRESS_DLQ: wager-transactions-dlq.fifo
  SQS_ALLOWED_PROVIDERS: provider-a,provider-b

x-pending-env: &pending-env
  <<: [*flags-off, *money-db]
  PENDING_WORKER_ENABLED: "true"

x-relay-env: &relay-env
  <<: [*flags-off, *aws]
  OUTBOX_ENABLED: "true"
  OUTBOX_DATABASE_URL: postgres://wallet_relay:wallet_relay_local@postgres:5432/wallet?sslmode=disable
  AWS_ACCESS_KEY_ID: wallet-outbox-relay
  AWS_SECRET_ACCESS_KEY: wallet-outbox-relay-local
  SQS_EVENTS_QUEUE: wallet-events.fifo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes:
      - ./deploy/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  localstack:
    image: localstack/localstack:4.7
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: standard
    ports: ["4566:4566"]
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    image: jungle-wallet-service:local
    command: ["migrate", "up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://postgres:postgres@postgres:5432/wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1:
    <<: *component
    environment: { <<: *api-env, INSTANCE_ID: api-1 }
    ports: ["8081:8080"]

  api-2:
    <<: *component
    environment: { <<: *api-env, INSTANCE_ID: api-2 }
    ports: ["8082:8080"]

  api-3:
    <<: *component
    environment: { <<: *api-env, INSTANCE_ID: api-3 }
    ports: ["8083:8080"]

  consumer-1:
    <<: *component
    environment: { <<: *consumer-env, INSTANCE_ID: consumer-1 }

  consumer-2:
    <<: *component
    environment: { <<: *consumer-env, INSTANCE_ID: consumer-2 }

  pending-worker-1:
    <<: *component
    environment: { <<: *pending-env, INSTANCE_ID: pending-worker-1 }

  pending-worker-2:
    <<: *component
    environment: { <<: *pending-env, INSTANCE_ID: pending-worker-2 }

  outbox-relay-1:
    <<: *component
    environment: { <<: *relay-env, INSTANCE_ID: outbox-relay-1 }

  outbox-relay-2:
    <<: *component
    environment: { <<: *relay-env, INSTANCE_ID: outbox-relay-2 }

volumes:
  pgdata:
